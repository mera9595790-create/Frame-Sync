<!DOCTYPE html>
<html>

<head>
    <title>FrameSync</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>FrameSync</h1>
    <p>Enter the frame delay in milliseconds.</p>
    <input type="number" id="frameDelay" placeholder="Frame Delay (ms)" />

    <a href="./measure.html" target="_blank"><button>Auto Measure</button></a>
    <button id="pauseResumeButton">Pause Delay</button>
    <hr>
    <button id="miniWindowButton" title="Opens the current page in a small popup window where the delay keeps working">Open in Mini Window</button>
    <p style="max-width: 260px; font-size: 11px; color: #666;">
        Native Picture-in-Picture bypasses the extension (PiP shows the unsynchronized original),
        so it is disabled while the delay is active. Use the mini window instead.
    </p>
    <hr>
    <a href="https://github.com/Trogen898/Frame-Sync" target="_blank">GitHub</a>
    <script src="./popup.js">
    </script>
</body>

</html>
